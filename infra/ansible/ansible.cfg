[defaults]
inventory = inventory/production.yml
roles_path = roles:~/.ansible/roles
collections_path = collections:~/.ansible/collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
vault_password_file = .vault_pass

[ssh_connection]
# Pipelining sends each task's Python module body over stdin in a single
# SSH command instead of SFTP-copying a temp file then exec'ing it —
# typically 5-10× faster on playbooks with many small tasks.
# Compatible with `Defaults use_pty` in sudo (only `requiretty` breaks it,
# which konstruktoid does not set).
pipelining = True
